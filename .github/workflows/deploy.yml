name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: love-letter-official-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      BOT_USERNAME: loveletter_official_bot
      DEFAULT_APP_ORIGIN: https://love-letter-official.black-sci-official.workers.dev
      DEFAULT_SUPPORT_CONTACT: "@loveletter_official_bot"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run test:syntax

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          npx wrangler whoami

      - name: Resolve or create D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_D1_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -n "$CONFIGURED_D1_ID" ]; then
            echo "D1_DATABASE_ID=$CONFIGURED_D1_ID" >> "$GITHUB_ENV"
            exit 0
          fi

          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const a=Array.isArray(x)?x:(x.result||[]);const d=a.find(v=>v.name==='love-letter-official-db');if(d)process.stdout.write(d.uuid||d.id||'')")

          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create love-letter-official-db --location eeur >/tmp/d1-create.txt
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const a=Array.isArray(x)?x:(x.result||[]);const d=a.find(v=>v.name==='love-letter-official-db');if(d)process.stdout.write(d.uuid||d.id||'')")
          fi

          test -n "$DB_ID" || (echo "Could not resolve D1 database id" && cat /tmp/d1-list.json && exit 1)
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Build production Wrangler config
        env:
          APP_ORIGIN_OVERRIDE: ${{ vars.APP_ORIGIN }}
          SUPPORT_CONTACT_OVERRIDE: ${{ vars.SUPPORT_CONTACT }}
        run: |
          export APP_ORIGIN="${APP_ORIGIN_OVERRIDE:-$DEFAULT_APP_ORIGIN}"
          export SUPPORT_CONTACT="${SUPPORT_CONTACT_OVERRIDE:-$DEFAULT_SUPPORT_CONTACT}"
          echo "APP_ORIGIN=$APP_ORIGIN" >> "$GITHUB_ENV"
          echo "SUPPORT_CONTACT=$SUPPORT_CONTACT" >> "$GITHUB_ENV"

          node - <<'NODE'
          import fs from "node:fs";
          const file = "wrangler.jsonc";
          const cfg = JSON.parse(fs.readFileSync(file, "utf8"));
          cfg.name = "love-letter-official";
          cfg.main = "./worker/index.js";
          cfg.compatibility_date = "2026-09-20";
          cfg.assets = {
            directory: "./public",
            binding: "ASSETS",
            not_found_handling: "single-page-application",
            html_handling: "none",
            run_worker_first: ["/api/*"]
          };
          cfg.vars = {
            APP_NAME: "Love Letter",
            BOT_USERNAME: process.env.BOT_USERNAME,
            MONTHLY_FREE_LIMIT: "3",
            LETTER_PRICE_XTR: "29",
            AUTH_MAX_AGE_SECONDS: "86400",
            DEV_BYPASS_AUTH: "false",
            APP_ORIGIN: process.env.APP_ORIGIN,
            SUPPORT_CONTACT: process.env.SUPPORT_CONTACT
          };
          cfg.d1_databases = [{
            binding: "DB",
            database_name: "love-letter-official-db",
            database_id: process.env.D1_DATABASE_ID
          }];
          fs.writeFileSync(file, JSON.stringify(cfg, null, 2) + "\n");
          NODE

          npm run check:config
          cat wrangler.jsonc

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply love-letter-official-db --remote

      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Prepare Telegram webhook secret
        env:
          CONFIGURED_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -n "$CONFIGURED_WEBHOOK_SECRET" ]; then
            echo "TELEGRAM_WEBHOOK_SECRET=$CONFIGURED_WEBHOOK_SECRET" >> "$GITHUB_ENV"
          else
            GENERATED=$(openssl rand -hex 32)
            echo "TELEGRAM_WEBHOOK_SECRET=$GENERATED" >> "$GITHUB_ENV"
          fi

      - name: Upload Telegram secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing TELEGRAM_BOT_TOKEN" && exit 1)
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET

      - name: Configure Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run bot:setup

      - name: Verify production
        run: |
          sleep 4
          echo "Checking $APP_ORIGIN/api/health"
          curl -fsS --retry 6 --retry-delay 2 "$APP_ORIGIN/api/health" | tee /tmp/health.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));if(!j.ok||j.version!=='1.3.0')process.exit(1);console.log('Production healthy:',j)"
