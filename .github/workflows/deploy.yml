name: Deploy to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run test:syntax

      - name: Render production config
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          SUPPORT_CONTACT: ${{ vars.SUPPORT_CONTACT }}
        run: |
          node - <<'NODE'
          import fs from "node:fs";

          const required = ["D1_DATABASE_ID","BOT_USERNAME","APP_ORIGIN","SUPPORT_CONTACT"];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`Missing GitHub repository variable: ${key}`);
          }

          const file = "wrangler.jsonc";
          let s = fs.readFileSync(file, "utf8");
          s = s
            .replace("REPLACE_WITH_D1_DATABASE_ID", process.env.D1_DATABASE_ID)
            .replace("REPLACE_WITH_BOT_USERNAME", process.env.BOT_USERNAME.replace(/^@/, ""))
            .replace("https://REPLACE_WITH_WORKER_DOMAIN.workers.dev", process.env.APP_ORIGIN.replace(/\/$/, ""))
            .replace("@replace_support", process.env.SUPPORT_CONTACT);
          fs.writeFileSync(file, s);
          NODE
          npm run check:config

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply love-letter-official-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Telegram secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_WEBHOOK_SECRET"
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET

      - name: Configure Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: npm run bot:setup

      - name: Verify health endpoint
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          sleep 3
          curl --fail --retry 4 --retry-delay 2 "$APP_ORIGIN/api/health"
