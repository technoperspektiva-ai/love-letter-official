name = "great-jarvis"
main = "src/index.js"
compatibility_date = "2026-09-20"

[vars]
DEFAULT_MODEL = "gpt-5.6"
SYSTEM_PROMPT = "Ты Great Jarvis — полезный AI-ассистент в Telegram. Отвечай на языке пользователя, понятно, естественно и по делу."

# После создания KV командой:
